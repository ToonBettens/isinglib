[project]
name = "isinglib"
version = "0.1.0"
description = "Codebase for Ising Machine Exploration"
authors = [
    { name = "ToonBettens", email = "toon.bettens@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.1",
    "scipy>=1.18.0",
]

[project.optional-dependencies]
io = [
    "h5py>=3.16.0",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
    "ty>=0.0.65",
]

[tool.ruff]
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes - unused imports/names, undefined names, etc.
    "I",    # isort - import sorting/grouping
    "UP",   # pyupgrade - modernize syntax to match target-version
    "B",    # flake8-bugbear - common bug patterns (mutable defaults, etc.)
    "C4",   # flake8-comprehensions - clearer/faster comprehensions
    "SIM",  # flake8-simplify - simpler equivalent code
    "RUF",  # ruff's own rules
    "NPY",  # numpy-specific rules (deprecated APIs, etc.) - this is a numpy-heavy library
    "PTH",  # flake8-use-pathlib - prefer pathlib over os.path (io/ already does this)
    "PT",   # flake8-pytest-style - consistent fixture/parametrize conventions
    "TID",  # flake8-tidy-imports - ban relative imports (this codebase is all-absolute already)
    "ERA",  # eradicate - flag commented-out code (we've cleaned out several stale blocks of this)
]
ignore = [
    "E501",   # line-too-long - prefer to manage by hand
    "PT018",  # forced splitting of assertions
]

[tool.ruff.lint.isort]
known-first-party = ["isinglib"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PT011"]  # forced match parameter in pytest.raises

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true  # several docstrings embed runnable examples (see graphs/generators.py)

[tool.ty.environment]
python-version = "3.13"  # match requires-python's floor, not whatever's installed
                          # locally (dev venvs here run 3.14) — otherwise ty would
                          # silently accept 3.14-only syntax nobody meant to require.
python-platform = "all"  # pure numpy/scipy, no OS-specific code anywhere — don't let
                          # ty assume the current OS and hide a platform-conditional issue.
root = ["src"]

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]  # without this, pytest walks the whole tree and collects
                       # stray test_*.py under private/ and any build artefacts.
addopts = "--strict-markers --strict-config"  # typo'd marker or config key is an
                                              # error, not a silently ignored line.
